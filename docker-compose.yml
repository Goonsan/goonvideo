version: '3'

services:
  nginx:
    image: nginx:alpine
    container_name: goon-video-astro
    restart: always
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy-network # On utilise le nom interne défini en bas
    labels:
      - "traefik.enable=true"

      # Router principal : domaine canonique (sans www)
      - "traefik.http.routers.towa-film.rule=Host(`towafilm.fr`)"
      - "traefik.http.routers.towa-film.entrypoints=websecure"
      - "traefik.http.routers.towa-film.tls=true"
      - "traefik.http.routers.towa-film.tls.certresolver=myresolver"

      # Router redirections : www.towafilm.fr et l'ancien domaine goonvideo.fr
      # renvoient en permanence (301) vers la meme page sur towafilm.fr.
      # A garder tant que goonvideo.fr existe : c'est ce qui transmet le referencement.
      - "traefik.http.routers.towa-film-redirect.rule=Host(`www.towafilm.fr`) || Host(`goonvideo.fr`) || Host(`www.goonvideo.fr`)"
      - "traefik.http.routers.towa-film-redirect.entrypoints=websecure"
      - "traefik.http.routers.towa-film-redirect.tls=true"
      - "traefik.http.routers.towa-film-redirect.tls.certresolver=myresolver"
      - "traefik.http.routers.towa-film-redirect.middlewares=to-towafilm"
      - "traefik.http.middlewares.to-towafilm.redirectregex.regex=^https?://[^/]+/(.*)"
      - "traefik.http.middlewares.to-towafilm.redirectregex.replacement=https://towafilm.fr/$${1}"
      - "traefik.http.middlewares.to-towafilm.redirectregex.permanent=true"

      # Meme redirection depuis HTTP, en un seul saut
      - "traefik.http.routers.towa-film-redirect-http.rule=Host(`www.towafilm.fr`) || Host(`goonvideo.fr`) || Host(`www.goonvideo.fr`)"
      - "traefik.http.routers.towa-film-redirect-http.entrypoints=web"
      - "traefik.http.routers.towa-film-redirect-http.middlewares=to-towafilm"

      # Redirection automatique HTTP -> HTTPS du domaine canonique
      - "traefik.http.routers.towa-film-http.rule=Host(`towafilm.fr`)"
      - "traefik.http.routers.towa-film-http.entrypoints=web"
      - "traefik.http.routers.towa-film-http.middlewares=astro-redirect"
      - "traefik.http.middlewares.astro-redirect.redirectscheme.scheme=https"

networks:
  proxy-network:
    external: true
    name: goon_web