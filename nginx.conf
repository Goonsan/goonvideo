server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Evite que nginx renvoie une redirection absolue (http://...) quand il
    # ajoute le slash final (ex: /portfolio -> /portfolio/). Sans ça, derriere
    # Traefik (qui parle en HTTP en interne au conteneur), nginx retombe le
    # visiteur en HTTP alors qu'il etait en HTTPS.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }
}
