server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Evite que nginx renvoie une redirection absolue (http://...) quand il
    # ajoute le slash final (ex: /portfolio -> /portfolio/). Sans ça, derriere
    # Traefik (qui parle en HTTP en interne au conteneur), nginx retombe le
    # visiteur en HTTP alors qu'il etait en HTTPS.
    absolute_redirect off;

    # Compression des fichiers texte (HTML, CSS, JS, SVG, XML...) : 3 a 4 fois moins
    # lourds a telecharger. Images, videos et polices sont deja compressees.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/xml application/manifest+json image/svg+xml;

    # Pages HTML : le navigateur redemande a chaque visite si la page a change
    # (reponse 304 tres legere si non), donc une mise a jour du site est vue tout de suite.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Fichiers generes par Astro (CSS, JS, polices) : leur nom change a chaque
    # modification, on peut donc les garder un an sans risque.
    # "^~" : cette regle passe avant celle des extensions ci-dessous.
    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Images, video, icones, bandeau cookies : une semaine. Si tu remplaces un fichier
    # en gardant le meme nom, certains visiteurs verront l'ancien jusqu'a 7 jours.
    location ~* \.(?:webp|avif|jpe?g|png|gif|svg|ico|mp4|webm|woff2?|css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }
}
