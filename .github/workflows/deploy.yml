name: Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & Build Astro
        run: |
          npm install
          npm run build

      # Garde-fou : on teste nginx.conf et le site dans le même conteneur que sur le serveur.
      # En cas d'erreur, le déploiement s'arrête ici et le site en ligne n'est pas touché.
      - name: Check nginx config
        run: |
          docker run --rm -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine nginx -t
          docker run -d --name nginx-test -p 8080:80 \
            -v "$PWD/dist:/usr/share/nginx/html:ro" \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine
          sleep 2
          curl -fsS -o /dev/null -w "accueil %{http_code}\n" http://localhost:8080/
          curl -fsS -o /dev/null -w "tarifs %{http_code}\n" http://localhost:8080/tarifs/
          docker rm -f nginx-test

      - name: Sync Dist Files (Website Content)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*"
          # AJOUT DU /dist À LA FIN DU TARGET
          target: "/home/ubuntu/goon-video-site/dist/" 
          strip_components: 1

      - name: Sync Docker Compose (Server Config)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx.conf"
          target: "/home/ubuntu/goon-video-site/"

      - name: Refresh Docker Container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/goon-video-site
            sudo docker compose up -d --force-recreate